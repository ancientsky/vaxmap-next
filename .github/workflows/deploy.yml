# 部署到 GitHub Pages。
# 院所資料不在這裡擷取：疾管署現站不接受境外連線（GitHub 的執行機器在國外，實測連線逾時），
# 所以改由一台國內機器定時擷取，把 hospitals.json 推到 `data` 分支，再觸發這個流程部署。
# 見 README「部署到 GitHub Pages」與 scripts/publish-data.sh。
name: 部署

on:
  push:
    branches: [main]
  workflow_dispatch:

# 預設不給任何權限，各工作只拿自己需要的
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read   # configure-pages 讀取 Pages 設定
    steps:
      # 第三方 action 一律釘選完整 commit SHA（註解為對應版本），避免標籤被改指向惡意版本
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: 取用 data 分支上較新的院所資料
        env:
          SKIP_RAW_CROSSCHECK: '1'
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # 公開 repo 可匿名讀取；data 分支不存在時沿用 main 裡的快照
          if git fetch --depth=1 "$REPO_URL" data 2>/dev/null; then
            git show FETCH_HEAD:hospitals.json > "$RUNNER_TEMP/hospitals.json"
            node scripts/keep-live-data.mjs --file "$RUNNER_TEMP/hospitals.json"
          else
            echo "沒有 data 分支，沿用 main 裡的快照"
          fi
          node --test tests/data.test.mjs

      - name: 邏輯測試
        run: node --test tests/logic.test.mjs

      - name: 摘要
        run: |
          node -e "const d=require('./public/data/hospitals.json');console.log('### 本次上線資料\n\n- 快照時間：'+d.meta.generatedAt+'\n- 院所數：'+d.hospitals.length)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write      # 部署到 Pages
      id-token: write   # 向 Pages 證明部署來源（OIDC）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
