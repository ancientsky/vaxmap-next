# 部署到 GitHub Pages。
# 院所資料不在這裡擷取：疾管署現站不接受境外連線（GitHub 的執行機器在國外，實測連線逾時），
# 所以改由一台國內機器定時擷取，把 hospitals.json 推到 `data` 分支（scripts/publish-data.sh）；接種資訊 info/<lang>.json
# 由 info-update.yml 在 GitHub 上擷取、翻譯後寫入同一個 data 分支。兩者都會在有變動時觸發這個流程部署。
# 見 README「部署到 GitHub Pages」與 docs/INFO_PIPELINE.md。
name: 部署

on:
  push:
    branches: [main]
  workflow_dispatch:

# 預設不給任何權限，各工作只拿自己需要的
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read   # configure-pages 讀取 Pages 設定
    steps:
      # 第三方 action 一律釘選完整 commit SHA（註解為對應版本），避免標籤被改指向惡意版本
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 取用 data 分支上較新的院所資料與接種資訊
        env:
          SKIP_RAW_CROSSCHECK: '1'
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # 公開 repo 可匿名讀取；data 分支不存在時沿用 main 裡的快照
          if git fetch --depth=1 "$REPO_URL" data 2>/dev/null; then
            git show FETCH_HEAD:hospitals.json > "$RUNNER_TEMP/hospitals.json"
            node scripts/keep-live-data.mjs --file "$RUNNER_TEMP/hospitals.json"
            # 接種資訊專區（info/<lang>.json）：有才取；每個檔各自驗證、比較新舊（見 docs/INFO_PIPELINE.md）
            mkdir -p "$RUNNER_TEMP/info"
            for l in zh-Hant en ja ko id vi th tl; do
              git show "FETCH_HEAD:info/$l.json" > "$RUNNER_TEMP/info/$l.json" 2>/dev/null || rm -f "$RUNNER_TEMP/info/$l.json"
            done
            node scripts/keep-live-data.mjs --info-dir "$RUNNER_TEMP/info"
          else
            echo "沒有 data 分支，沿用 main 裡的快照"
          fi
          node --test tests/data.test.mjs

      - name: 檢查接種資訊檔
        run: |
          if compgen -G 'public/data/info/*.json' >/dev/null; then
            node scripts/sanitize-info.mjs --check public/data/info/*.json
          else
            echo "沒有接種資訊檔，略過"
          fi

      - name: 邏輯測試
        run: node --test tests/logic.test.mjs

      - name: 摘要
        run: |
          node -e "const d=require('./public/data/hospitals.json');console.log('### 本次上線資料\n\n- 快照時間：'+d.meta.generatedAt+'\n- 院所數：'+d.hospitals.length)" >> "$GITHUB_STEP_SUMMARY"
          node -e "try{const d=require('./public/data/info/zh-Hant.json');const t=['en','ja','ko','id','vi','th','tl'].map(l=>{try{const x=require('./public/data/info/'+l+'.json');return l+' '+x.sections.filter(s=>s.translated).length+'/'+x.sections.length}catch{return l+' —'}});console.log('- 接種資訊：抓取 '+d.meta.fetchedAt+'，來源變動 '+d.meta.changedAt+'；已翻譯區塊 '+t.join('、'))}catch{console.log('- 接種資訊：無')}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write      # 部署到 Pages
      id-token: write   # 向 Pages 證明部署來源（OIDC）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
